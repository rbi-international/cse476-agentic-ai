name: pr-review-crew

# Runs the PR Review Crew on every pull request in this repository.
# WHY pull_request and never pull_request_target: the crew runs the pull request's own
# tests. pull_request_target would run them with write access and secrets, which lets
# a stranger's code steal them. With pull_request, a fork's run gets a read-only token
# and no secrets; the crew then reviews offline and writes its review to the job summary.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # only to post the review comment

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the crew needs the base commit to compute the diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the crew and the project
        run: |
          python -m pip install --upgrade pip
          pip install -r pr_review_crew/requirements.txt python-dotenv
          pip install -e . --no-deps

      - name: Run the crew and post its review
        working-directory: pr_review_crew
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional: without it the crew reviews offline
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m crew.cli --base ${{ github.event.pull_request.base.sha }}
