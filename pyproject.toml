[project]
name = "cse476"
version = "0.1.0"
description = "CSE476 Agentic AI and Intelligent Automation, LPU"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# tests live in tests/. The mock_run_*.py files are standalone offline
# demonstration scripts, not pytest tests, so they are not collected here;
# run them directly with, for example, python tests/mock_run_u3l2.py
testpaths = ["tests"]
python_files = ["test_*.py"]
